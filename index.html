<style>
:root{
  --navy:#002b5c; --navy-700:#0a3b70; --navy-100:#e6edf4;
  --green:#92d050; --green-dark:#6fa834;
  --slate:#6c6966; --paper:#ffffff; --border-soft:#ddd9d2;
  --text-primary:#121212; --text-secondary:#6c6966; --text-muted:#aba7a2;
  --shadow: 0 1px 2px rgba(0,0,0,.18), 0 8px 30px -10px rgba(0,11,26,.5);
  --radius: 10px;
  --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --font-body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse 1200px 700px at 15% -10%, var(--navy-700) 0%, var(--navy) 55%), var(--navy);
  color:#fff; font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; justify-content:center;
}
h1,h2{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0;color:#fff;}
a{color:inherit; text-decoration:none;}

.wrap{max-width:920px; width:100%; margin:0 auto; padding:36px 24px 44px; min-height:100vh; display:flex; flex-direction:column;}
.wrap-mid{flex:1; display:flex; flex-direction:column; justify-content:center;}
.tk-logo{display:block; height:56px; width:auto; align-self:flex-start;}

h1{font-size:clamp(34px,5.4vw,48px); line-height:1; margin-top:26px;}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:28px; text-align:left;}
@media (max-width:700px){.grid{grid-template-columns:1fr;}}

.panel-card{background:var(--paper); border:1px solid var(--border-soft); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px 24px; display:flex; flex-direction:column; gap:12px; transition:transform .15s, box-shadow .15s; border-top:4px solid var(--green);}
.panel-card:hover{transform:translateY(-2px); box-shadow:0 12px 34px -8px rgba(0,0,0,.55);}
.panel-card .pc-eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); font-weight:600;}
.panel-card h2{font-size:22px; line-height:1.08; color:var(--text-primary);}
.panel-card .pc-cta{margin-top:auto; padding-top:6px; font-family:var(--font-mono); font-size:12.5px; font-weight:700; color:var(--green-dark); display:flex; align-items:center; gap:6px;}
.panel-card:hover .pc-cta{text-decoration:underline;}
.panel-card.improd{border-top-color:var(--slate);}
.panel-card.improd .pc-cta{color:var(--slate);}

.foot{margin-top:40px; padding-top:16px; border-top:1px solid rgba(255,255,255,.18); font-size:12px; color:rgba(255,255,255,.55);}
</style>
</head>
